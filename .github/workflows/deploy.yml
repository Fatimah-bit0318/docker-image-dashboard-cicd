name: CI/CD - Build, Push to ECR and Deploy to Kubernetes

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: docker-image-dashboard
  AWS_ACCOUNT_ID: "834176180969"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          PYTHONPATH=. python3 -m pytest tests/ -v

      - name: Set image metadata
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "APP_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=$APP_VERSION \
            --build-arg BUILD_NUMBER=$BUILD_NUMBER \
            --build-arg IMAGE_TAG=$IMAGE_TAG \
            --build-arg GIT_COMMIT=$GITHUB_SHA \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image to ECR
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/docker-dashboard \
            dashboard=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

          kubectl set env deployment/docker-dashboard \
            ENVIRONMENT=Production \
            DEPLOYMENT_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            IMAGE_TAG=$IMAGE_TAG

          kubectl rollout status deployment/docker-dashboard --timeout=180s
