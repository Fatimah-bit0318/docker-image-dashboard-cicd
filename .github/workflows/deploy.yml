name: Docker Build and Kubernetes Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Debug repository
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Tests directory:"
          ls -la tests || true

          echo ""
          echo "Files under tests:"
          find tests -type f || true

          echo ""
          echo "Contents of test_app.py:"
          cat tests/test_app.py || true

      - name: Run tests
        run: |
          PYTHONPATH=. python3 -m pytest tests/ -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-image-dashboard:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-image-dashboard:latest

      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/docker-dashboard \
            dashboard=${{ secrets.DOCKER_USERNAME }}/docker-image-dashboard:latest

          kubectl rollout status deployment/docker-dashboard
