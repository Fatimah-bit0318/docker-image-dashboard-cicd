name: Docker Build and Kubernetes Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'templates/**'
      - 'tests/**'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # ----------------------------------------
      # 1. Checkout Source Code
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Set Up Python
      # ----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------
      # 3. Install Dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ----------------------------------------
      # 4. Run Automated Tests
      # ----------------------------------------
      - name: Run tests
        run: |
          PYTHONPATH=. python3 -m pytest tests/

      # ----------------------------------------
      # 5. Generate Build Information
      # ----------------------------------------
      - name: Generate build metadata
        run: |
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "GIT_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "DEPLOYMENT_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      # ----------------------------------------
      # 6. Login to AWS ECR
      # ----------------------------------------
      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            834176180969.dkr.ecr.eu-north-1.amazonaws.com

      # ----------------------------------------
      # 7. Build Docker Image
      # ----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg BUILD_NUMBER=${BUILD_NUMBER} \
            --build-arg IMAGE_TAG=${IMAGE_TAG} \
            --build-arg GIT_COMMIT=${GIT_COMMIT} \
            -t 834176180969.dkr.ecr.eu-north-1.amazonaws.com/docker-image-dashboard:${IMAGE_TAG} \
            .

      # ----------------------------------------
      # 8. Push Docker Image to AWS ECR
      # ----------------------------------------
      - name: Push Docker image to AWS ECR
        run: |
          docker push \
            834176180969.dkr.ecr.eu-north-1.amazonaws.com/docker-image-dashboard:${IMAGE_TAG}

      # ----------------------------------------
      # 9. Update Kubernetes Deployment
      # ----------------------------------------
      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/docker-dashboard \
            dashboard=834176180969.dkr.ecr.eu-north-1.amazonaws.com/docker-image-dashboard:${IMAGE_TAG}

          kubectl set env deployment/docker-dashboard \
            APP_VERSION=${APP_VERSION} \
            BUILD_NUMBER=${BUILD_NUMBER} \
            IMAGE_TAG=${IMAGE_TAG} \
            GIT_COMMIT=${GIT_COMMIT} \
            DEPLOYMENT_TIME=${DEPLOYMENT_TIME} \
            ENVIRONMENT=Production

      # ----------------------------------------
      # 10. Wait for Kubernetes Rolling Update
      # ----------------------------------------
      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/docker-dashboard --timeout=300s

      # ----------------------------------------
      # 11. Show Deployment Information
      # ----------------------------------------
      - name: Show deployment status
        run: |
          echo "=========================================="
          echo "Deployment completed successfully"
          echo "=========================================="
          echo "App Version: ${APP_VERSION}"
          echo "Build Number: ${BUILD_NUMBER}"
          echo "Image Tag: ${IMAGE_TAG}"
          echo "Git Commit: ${GIT_COMMIT}"
          echo "=========================================="

          kubectl get pods
          kubectl get deployment docker-dashboard

          echo "Deployed Image:"
          kubectl get deployment docker-dashboard \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""
